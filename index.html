<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabriel Cruz | Relojes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080808;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Contenedor del Logo */
    .logo-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 250px;
      height: 250px;
    }

    /* Texto GC con gradiente dorado */
   .initials {
  font-size: 7.5rem;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
  animation: zoomIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
    /* Anillo dorado giratorio */
    .ring {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 2px solid transparent;
      border-top-color: #d4af37;
      border-bottom-color: #d4af37;
      border-radius: 50%;
      animation: spin 3s linear infinite;
    }

    /* Subtítulo Gabriel Cruz */
    .brand-name {
      color: #cccccc;
      font-size: 0.95rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 15px;
      opacity: 0;
      animation: fadeIn 1s ease-in 1s forwards;
    }

    /* Barra de carga corregida */
    .loader-bar {
      width: 140px;
      height: 3px;
      background: #222222;
      margin-top: 30px;
      border-radius: 3px;
      overflow: hidden;
    }

    .loader-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #b38728, #fcf6ba);
      animation: loadProgress 5s linear forwards;
    }

    /* Animaciones */
    @keyframes zoomIn {
      0% {
        opacity: 0;
        transform: scale(0.4);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <div class="ring"></div>
    <h1 class="initials">GC</h1>
  </div>
  
  <p class="brand-name">Gabriel Cruz</p>

  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>

  <script>
    // Redirección automática a los 5 segundos a tu catálogo
    setTimeout(() => {
      window.location.href = "gaby.html";
    }, 5000);
  </script>

</body>
</html>
