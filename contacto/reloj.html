<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relojería & Alta Gama - Gabriel Cruz</title>
  <!-- FontAwesome para Logos Oficiales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="uno.css">
</head>
<body>

  <!-- Fondo de Relojería de Lujo en Canvas -->
  <canvas id="clockCanvas"></canvas>

  <main class="container">
    <!-- Encabezado de Marca -->
    <header class="profile-header">
      <div class="logo-gc">GC</div>
      <h1 class="user-name">Gabriel Cruz</h1>
      <p class="tagline">Alta Relojería & Piezas Exclusivas</p>
    </header>

    <!-- Pila de Cuadros de Contacto -->
    <section class="cards-stack">
      
      <!-- Card WhatsApp -->
      <a href="https://wa.me/message/UAH6AY7OISSFI1" target="_blank" class="contact-card" aria-label="WhatsApp">
        <div class="card-icon">
          <i class="fa-brands fa-whatsapp"></i>
        </div>
        <div class="card-info">
          <h2>WhatsApp</h2>
          <p>Catálogo exclusivo, presupuestos y compras directas.</p>
        </div>
      </a>

      <!-- Card Instagram -->
      <a href="https://www.instagram.com/gabi_cruz172?igsi=MWp3cmtiYWUwY3o2" target="_blank" class="contact-card" aria-label="Instagram">
        <div class="card-icon">
          <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="card-info">
          <h2>Instagram</h2>
          <p>Galería de modelos en stock, videos y detalles táctiles.</p>
        </div>
      </a>

      <!-- Card Facebook -->
      <a href="https://www.facebook.com/share/1FUnqECRGf/" target="_blank" class="contact-card" aria-label="Facebook">
        <div class="card-icon">
          <i class="fa-brands fa-facebook-f"></i>
        </div>
        <div class="card-info">
          <h2>Facebook</h2>
          <p>Nuestra tienda en línea y recomendaciones de clientes.</p>
        </div>
      </a>

    </section>
  </main>

  <script src="reloj.js"></script>
</body>
</html>
